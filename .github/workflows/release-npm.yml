name: Release npm

permissions: {}

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - notify-napi/package.json
      - .github/workflows/release-npm.yml
      - .github/actions/check-version/action.yml
      - .github/scripts/wait-for-npm-packages.mjs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash
    working-directory: notify-napi

jobs:
  check:
    name: Check version
    if: github.repository == 'rolldown/notify' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version_changed: ${{ steps.check.outputs.version_changed }}
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - uses: ./.github/actions/check-version
        id: check
        with:
          file-name: notify-napi/package.json
          file-url: https://unpkg.com/@rolldown/notify@latest/package.json

  build:
    name: Build ${{ matrix.target }}
    needs: check
    if: needs.check.outputs.version_changed == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            test: true
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            test: true
          - os: windows-latest
            target: aarch64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            flags: --use-napi-cross
            test: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            flags: --use-napi-cross
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            flags: --cross-compile
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            flags: --cross-compile
          - os: ubuntu-latest
            target: wasm32-wasip1-threads
            test: true
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          cache-key: release-npm-${{ matrix.target }}

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          package_json_file: notify-napi/package.json

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: notify-napi/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2.2.1
        if: contains(matrix.target, 'musl')
        with:
          version: 0.13.0

      - name: Build bindings
        run: pnpm run build:native --target ${{ matrix.target }} ${{ matrix.flags }}

      - name: Build JavaScript
        run: pnpm run build:js

      - name: Test native bindings
        if: matrix.test && matrix.target != 'wasm32-wasip1-threads'
        run: pnpm exec vitest run

      - name: Test WASI bindings
        if: matrix.target == 'wasm32-wasip1-threads'
        run: pnpm exec vitest run --mode wasi

      - name: Upload bindings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bindings-${{ matrix.target }}
          if-no-files-found: error
          path: notify-napi/dist

  publish:
    name: Publish npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      npm_config_provenance: true
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          package_json_file: notify-napi/package.json

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: notify-napi/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bindings-*
          path: notify-napi/artifacts

      - name: Prepare packages
        run: |
          mkdir -p dist
          cp -R artifacts/bindings-wasm32-wasip1-threads/. dist/
          pnpm exec napi create-npm-dirs --npm-dir npm
          pnpm exec napi artifacts --output-dir artifacts --build-output-dir dist --npm-dir npm
          pnpm run build:js
          pnpm run typecheck
          pnpm exec napi pre-publish --npm-dir npm --no-gh-release -t npm --dry-run

      - name: Publish platform packages
        run: pnpm exec napi pre-publish --npm-dir npm --no-gh-release -t npm

      - name: Wait for platform packages
        run: node ../.github/scripts/wait-for-npm-packages.mjs npm/*

      - name: Publish package
        run: pnpm publish --provenance --access public --no-git-checks
