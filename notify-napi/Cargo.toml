[package]
name = "rolldown-notify-napi"
version = "0.0.2"
description = "Node.js bindings for rolldown-notify"
license = "MIT OR Apache-2.0"
rust-version.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true

[lib]
name = "notify_napi"
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
dunce = "1.0.5"
globset = "0.4.16"
napi = { version = "3.14.2", default-features = false, features = ["dyn-symbols", "napi8"] }
napi-derive = "3.6.12"
rolldown-notify.workspace = true
rolldown-notify-debouncer-full.workspace = true

[build-dependencies]
napi-build = "2.6.0"
